<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DouYin Spark Flow</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0f766e;
      --border: #dbe3ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #e6fffb 0%, var(--bg) 42%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.1;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.7;
    }

    code {
      background: #eff6ff;
      border-radius: 6px;
      padding: 2px 8px;
      color: #1d4ed8;
    }

    .grid {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      background: #fbfdff;
    }

    .item strong {
      display: block;
      margin-bottom: 6px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>DouYin Spark Flow</h1>
    <p>服务已启动。这个仓库当前主要提供 Flask API、Socket.IO 推送、调度器和 Celery 执行链路。</p>
    <p>如果你是本地验证，可优先检查 <code>/api/system/public</code> 和调度相关接口是否返回正常。</p>

    <section class="grid">
      <div class="item">
        <strong>Web 服务</strong>
        默认监听 <code>5009</code> 端口，Dockerfile 也以 <code>web_app:app</code> 作为主入口。
      </div>
      <div class="item">
        <strong>调度器</strong>
        可通过 <code>python scheduler.py</code> 单独启动任务轮询。
      </div>
      <div class="item">
        <strong>执行引擎</strong>
        Celery worker 负责实际的 Playwright 任务分发与执行。
      </div>
    </section>
  </main>
</body>
</html>
